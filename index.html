<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova AI - Landing Page Startup</title>

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Dark Mode berbasis Class -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans">

<!-- ==========================================
1. NAVBAR SECTION (Flexbox + Dark Mode Switcher)
========================================== -->
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">

<div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

<!-- Brand/Logo Startup -->
<div class="flex items-center space-x-2">
<span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-teal-600">
TechNova.AI
</span>
</div>

<!-- Navigasi (burger di mobile, horizontal di desktop) -->
<div id="menu"
class="hidden md:flex absolute md:static top-full left-4 right-4 flex-col md:flex-row md:items-center gap-1 md:gap-0 md:space-x-8 p-3 md:p-0 mt-2 md:mt-0 font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 md:bg-transparent md:dark:bg-transparent border md:border-0 border-slate-200 dark:border-slate-700 rounded-xl shadow-lg md:shadow-none">
<a href="#hero" class="px-3 py-2 md:p-0 hover:text-emerald-600 dark:hover:text-emerald-400 transition">Beranda</a>
<a href="#features" class="px-3 py-2 md:p-0 hover:text-emerald-600 dark:hover:text-emerald-400 transition">Fitur</a>
<a href="#pricing" class="px-3 py-2 md:p-0 hover:text-emerald-600 dark:hover:text-emerald-400 transition">Harga</a>
<a href="#footer" class="px-3 py-2 md:p-0 hover:text-emerald-600 dark:hover:text-emerald-400 transition">Kontak</a>
</div>

<!-- Tombol Dark Mode Switcher & CTA -->
<div class="flex items-center space-x-3">

<!-- Button Dark Mode Toggle -->
<button
onclick="document.documentElement.classList.toggle('dark')"
class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
aria-label="Toggle Dark Mode">

<!-- Icon Sun/Moon -->
<span class="dark:hidden">🌙</span>
<span class="hidden dark:inline">☀</span>
</button>

<!-- Tombol Burger (hanya mobile) -->
<button
onclick="toggleMenu()"
class="md:hidden p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
aria-label="Buka Menu">
☰
</button>

<a href="#pricing" class="hidden sm:inline-block px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-md transition">
Coba Gratis
</a>
</div>

</div>
</nav>                     
                    

</body>
</html>
